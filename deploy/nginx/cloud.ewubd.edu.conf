server {
    listen 80;
    listen [::]:80;
    server_name cloud.ewubd.edu localcloud.ewubd.edu;
    return 301 https://cloud.ewubd.edu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localcloud.ewubd.edu;

    ssl_certificate /etc/nginx/ssl/ewubd.edu.crt;
    ssl_certificate_key /etc/nginx/ssl/ewubd.edu.key;
    return 301 https://cloud.ewubd.edu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloud.ewubd.edu;

    ssl_certificate /etc/nginx/ssl/ewubd.edu.crt;
    ssl_certificate_key /etc/nginx/ssl/ewubd.edu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Complete local archive, exposed by the persistent systemd bind mount.
    location /backend/uploads/ {
        alias /home/ewuwebsite/ewu-backend/uploads/;
        try_files $uri =404;
    }

    location /backend/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
