services:
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
      target: development
    container_name: api-gateway
    restart: always
    env_file:
      - .env
    volumes:
      - /home/ewuwebsite/ewu-backend/uploads:/usr/src/app/uploads
    ports:
      - '4000:4000'
    depends_on:
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
      target: development
    command: yarn start:dev user-service
    restart: always
    env_file:
      - .env
    depends_on:
      - user-db
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '4001:4001'

  page-builder:
    build:
      context: .
      dockerfile: ./apps/page-builder/Dockerfile
      target: development
    command: yarn start:dev page-builder
    restart: always
    env_file:
      - .env
    depends_on:
      - page-builder-db
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '4002:4002'
  
  master-data:
    build:
      context: .
      dockerfile: ./apps/master-data/Dockerfile
      target: development
    command: yarn start:dev master-data
    restart: always
    env_file:
      - .env
    depends_on:
      - master-data-db
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '4003:4003'

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - '5673:5673'
      - '15673:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_NODE_PORT=5673

  user-db:
    container_name: user-db
    image: postgres:16.0
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=user-db
      - PGPORT=5433
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - '5433:5433'

  page-builder-db:
    container_name: page-builder-db
    image: postgres:16.0
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=page-builder-db
      - PGPORT=5434
    volumes:
      - page-builder-db-data:/var/lib/postgresql/data
    ports:
      - '5434:5434'

  master-data-db:
    container_name: master-data-db
    image: postgres:16.0
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=master-data-db
      - PGPORT=5435
    volumes:
      - master-data-db-data:/var/lib/postgresql/data
    ports:
      - '5435:5435'

volumes:
  user-db-data:
  page-builder-db-data:
  master-data-db-data:
